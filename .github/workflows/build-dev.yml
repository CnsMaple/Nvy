name: Build dev

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.4.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: msbuild build\Nvy.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ inputs.version }}-dev
          name: Release v${{ inputs.version }}-dev
          artifacts: build\Release\Nvy.exe
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
