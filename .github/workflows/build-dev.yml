name: Build dev

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get base version
        id: version
        shell: bash
        run: |
          BASE=$(curl -sL https://api.github.com/repos/RMichelsen/Nvy/releases/latest \
            | grep '"tag_name"' | sed 's/.*"v\(.*\)".*/\1/' | head -1 || echo "0.4.0")
          echo "tag=v${BASE}-dev" >> $GITHUB_OUTPUT

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: msbuild build\Nvy.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          artifacts: build\Release\Nvy.exe
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
