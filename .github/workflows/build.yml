name: Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.4.2-dev)"
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: msbuild build\Nvy.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          files: build\Release\Nvy.exe
          generate_release_notes: true
