name: Build

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: "Version suffix (default: auto from commit)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate version
        id: version
        shell: bash
        run: |
          SHA=$(git rev-parse --short HEAD)
          if [ -z "${{ inputs.version_suffix }}" ]; then
            echo "tag=v0.4.2-$SHA" >> $GITHUB_OUTPUT
          else
            echo "tag=v0.4.2-${{ inputs.version_suffix }}" >> $GITHUB_OUTPUT
          fi

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: msbuild build\Nvy.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          artifacts: build\Release\Nvy.exe
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
