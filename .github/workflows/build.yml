name: Build

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: "Version suffix (default: auto from commit)"
        required: false
        type: string

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate version
        id: version
        shell: bash
        run: |
          SHA=$(git rev-parse --short HEAD)
          if [ -z "${{ inputs.version_suffix }}" ]; then
            echo "tag=v0.4.2-$SHA" >> $GITHUB_OUTPUT
          else
            echo "tag=v0.4.2-${{ inputs.version_suffix }}" >> $GITHUB_OUTPUT
          fi

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: msbuild build\Nvy.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          files: build\Release\Nvy.exe
          generate_release_notes: true
